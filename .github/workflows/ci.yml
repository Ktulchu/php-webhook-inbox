name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services: &postgres_service
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: webhooks
          POSTGRES_USER: webhooks
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U webhooks -d webhooks"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env: &db_env
      DB_HOST: 127.0.0.1
      DB_NAME: webhooks
      DB_USER: webhooks
      DB_PASSWORD: test_password
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git diff --check origin/main...HEAD
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer audit --no-interaction
      - run: php examples/basic/bin/migrate.php
      - run: composer test
      - run: composer analyse

  framework-adapters:
    runs-on: ubuntu-latest
    services: *postgres_service
    env: *db_env
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql,mbstring,dom,xml
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Install optional frameworks for their real adapter tests
        run: |
          composer config --no-interaction repositories.asset-packagist composer https://asset-packagist.org
          composer config --no-interaction allow-plugins.yiisoft/yii2-composer true
          composer require --dev --no-interaction --no-progress "yiisoft/yii2:^2.0.53" "doctrine/dbal:^4.3"
      - run: php examples/basic/bin/migrate.php
      - run: vendor/bin/phpunit tests/AdapterIntegrationTest.php
      - run: vendor/bin/phpstan analyse --configuration phpstan-adapters.neon --no-progress

  consumer:
    runs-on: ubuntu-latest
    services: *postgres_service
    env: *db_env
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php examples/basic/bin/migrate.php
      - name: Install from an independent path consumer
        working-directory: tests/fixtures/consumer
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          php verify.php

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure local demo
        run: cp .env.example .env
      - name: Build and start stack
        run: docker compose up --build -d
      - name: Verify signed delivery, deduplication and worker effect
        shell: bash
        run: |
          set -euo pipefail
          source .env
          BODY='{"id":"smoke-1","amount":19}'
          STAMP=$(date +%s)
          SIG=$(printf '%s.%s' "$STAMP" "$BODY" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" -hex | awk '{print $NF}')
          ready=0
          for i in {1..15}; do
            if curl --silent --output /dev/null --max-time 2 http://127.0.0.1:8080/not-found; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          CODE=$(curl -sS -o /tmp/webhook-response -w '%{http_code}' \
            -X POST http://127.0.0.1:8080/webhook \
            -H "X-Webhook-Timestamp: $STAMP" \
            -H "X-Webhook-Signature: sha256=$SIG" --data-binary "$BODY")
          test "$CODE" = '202'
          CODE=$(curl -sS -o /tmp/webhook-response -w '%{http_code}' \
            -X POST http://127.0.0.1:8080/webhook \
            -H "X-Webhook-Timestamp: $STAMP" \
            -H "X-Webhook-Signature: sha256=$SIG" --data-binary "$BODY")
          test "$CODE" = '200'
          docker compose run --rm app php examples/basic/bin/worker.php --once
          COUNT=$(docker compose exec -T db psql -U webhooks -d webhooks -At \
            -c "SELECT count(*) FROM demo_effects WHERE event_id='smoke-1' AND amount=19")
          test "$COUNT" = '1'
      - name: Show diagnostics on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
