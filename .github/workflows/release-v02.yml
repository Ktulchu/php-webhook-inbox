name: Release v0.2.0 after successful main CI

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

permissions:
  contents: read

jobs:
  first-release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Ensure this CI belongs to the one designated release merge
        id: guard
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          if [ "$(git log -1 --format=%s)" = "release: v0.2.0" ]; then
            echo 'publish=yes' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=no' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish exactly v0.2.0
        if: steps.guard.outputs.publish == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if gh release view v0.2.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.2.0 GitHub release already exists; do not republish"
            exit 0
          fi
          git fetch --tags
          if git rev-parse --verify refs/tags/v0.2.0 >/dev/null 2>&1; then
            echo "::error::v0.2.0 tag already exists without a release; manual review required"
            exit 1
          fi
          gh release create v0.2.0 --repo "$GITHUB_REPOSITORY" --target "$HEAD_SHA" --title "v0.2.0 — First public Composer library release" --notes-file docs/releases/v0.2.0.md
